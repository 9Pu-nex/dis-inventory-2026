<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DIS INVENTORY</title>
<meta name="theme-color" content="#0f0f0f" id="theme-color">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Theme bootstrap — runs before first paint so there is no flash.
  (function () {
    try {
      var saved = localStorage.getItem('dis-theme');
      var theme = saved === 'dark' || saved === 'light'
        ? saved
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.dataset.theme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', theme === 'light' ? '#f7f7f8' : '#0f0f0f');
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  })();
</script>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2a2a2a;
    --border2: #333333;
    --text: #f0f0f0;
    --text2: #888888;
    --text3: #555555;
    --accent: #4ade80;
    --accent2: #22c55e;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --on-accent: #000000;
    --overlay: rgba(0, 0, 0, .7);
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);

    --radius: 12px;
    --radius-sm: 8px;

    --pad: clamp(10px, 3vw, 22px);
    --gap: clamp(8px, 2vw, 14px);
    --card-min: clamp(140px, 28vw, 200px);
  }

  [data-theme="light"] {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --surface2: #f0f0f2;
    --border: #e4e4e7;
    --border2: #d4d4d8;
    --text: #18181b;
    --text2: #52525b;
    --text3: #a1a1aa;
    --accent: #16a34a;
    --accent2: #15803d;
    --red: #dc2626;
    --amber: #d97706;
    --blue: #2563eb;
    --purple: #7c3aed;
    --on-accent: #ffffff;
    --overlay: rgba(24, 24, 27, .4);
    --shadow: 0 10px 30px rgba(24, 24, 27, .14);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: 'IBM Plex Sans Thai', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s ease, color .2s ease;
  }

  button, input, select { font: inherit; color: inherit; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ── Sticky top block ─────────────────────────────────────────────── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 60;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: var(--pad) var(--pad) 8px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    flex: 1;
    min-width: 0;
    text-align: left;
  }

  .logo-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--on-accent);
    display: grid;
    place-items: center;
    font-size: 17px;
    flex-shrink: 0;
  }

  .logo-text-wrap { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }

  .logo-text {
    font-size: clamp(13px, 3vw, 16px);
    font-weight: 600;
    letter-spacing: -.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .logo-sub {
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text2);
    letter-spacing: .4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .header-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .lang-toggle {
    display: flex;
    gap: 2px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 2px;
  }

  .lang-btn {
    border: none;
    background: transparent;
    color: var(--text2);
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    border-radius: 6px;
    cursor: pointer;
    min-height: 32px;
  }

  .lang-btn.active { background: var(--accent); color: var(--on-accent); }

  .icon-btn {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
    flex-shrink: 0;
  }

  .icon-btn:hover { background: var(--surface2); border-color: var(--accent); color: var(--accent); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* ── Search ───────────────────────────────────────────────────────── */
  .search-wrap { position: relative; padding: 0 var(--pad) 8px; }

  .search-icon {
    position: absolute;
    left: calc(var(--pad) + 12px);
    top: 50%;
    transform: translateY(-68%);
    color: var(--text3);
    pointer-events: none;
    display: flex;
  }

  .search-icon svg { width: 16px; height: 16px; }

  .search-input {
    width: 100%;
    padding: 11px 40px 11px 40px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
    -webkit-appearance: none;
  }

  .search-input::placeholder { color: var(--text3); }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }

  .search-clear {
    position: absolute;
    right: calc(var(--pad) + 6px);
    top: 50%;
    transform: translateY(-70%);
    width: 30px;
    height: 30px;
    display: none;
    place-items: center;
    border: none;
    border-radius: 50%;
    background: var(--surface2);
    color: var(--text2);
    cursor: pointer;
    font-size: 12px;
  }

  .search-clear.show { display: grid; }

  /* ── Tabs ─────────────────────────────────────────────────────────── */
  .tabs-wrap { overflow-x: auto; scrollbar-width: none; }
  .tabs-wrap::-webkit-scrollbar { display: none; }

  .tabs { display: flex; gap: 2px; padding: 0 var(--pad); min-width: max-content; }

  .tab {
    border: none;
    border-bottom: 2px solid transparent;
    background: none;
    color: var(--text2);
    font-size: 12.5px;
    font-weight: 500;
    padding: 9px 11px;
    min-height: 42px;
    cursor: pointer;
    white-space: nowrap;
    transition: color .15s ease, border-color .15s ease;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* ── Status chips ─────────────────────────────────────────────────── */
  .filters-wrap {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 8px var(--pad) 10px;
    border-bottom: 1px solid var(--border);
  }

  .filters-wrap::-webkit-scrollbar { display: none; }

  .chip {
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text2);
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 8px 14px;
    min-height: 36px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color .15s ease, border-color .15s ease, color .15s ease;
  }

  .chip:hover { color: var(--text); border-color: var(--text2); }
  .chip.active { color: var(--text); border-color: var(--text2); background: var(--surface2); }
  .chip.count-0 { opacity: .45; }

  /* ── Layout ───────────────────────────────────────────────────────── */
  .main {
    padding: var(--pad);
    padding-bottom: calc(60px + env(safe-area-inset-bottom, 0px));
    max-width: 1400px;
    margin: 0 auto;
  }

  .result-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 0 10px;
    flex-wrap: wrap;
  }

  .result-count { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--text2); }

  .sort-wrap { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }

  .sort-wrap select {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: var(--radius-sm);
    padding: 7px 9px;
    font-size: 12px;
    min-height: 36px;
    cursor: pointer;
  }

  /* ── Dashboard ────────────────────────────────────────────────────── */
  .dashboard { display: flex; flex-direction: column; gap: 16px; margin-bottom: 18px; }
  .dashboard h2 { font-size: 15px; font-weight: 600; }
  .dash-group h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--text2); margin-bottom: 8px; }

  .dash-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }

  .dash-tile {
    display: flex;
    flex-direction: column;
    gap: 2px;
    align-items: flex-start;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    min-height: 58px;
    cursor: pointer;
    transition: border-color .15s ease, transform .15s ease;
  }

  .dash-tile:hover { border-color: var(--border2); transform: translateY(-1px); }
  .dash-tile-num { font-size: 18px; font-weight: 600; font-family: 'IBM Plex Mono', monospace; }
  .dash-tile-label { font-size: 11px; color: var(--text2); }

  .dash-tile.tile-using .dash-tile-num { color: var(--accent); }
  .dash-tile.tile-broken .dash-tile-num { color: var(--red); }
  .dash-tile.tile-repair .dash-tile-num { color: var(--amber); }
  .dash-tile.tile-lost .dash-tile-num { color: var(--purple); }
  .dash-tile.tile-standby .dash-tile-num { color: var(--blue); }
  .dash-tile.tile-none .dash-tile-num { color: var(--text2); }

  .updated-row { font-size: 11px; color: var(--text3); font-family: 'IBM Plex Mono', monospace; }

  /* ── Cards (grid) ─────────────────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
    gap: var(--gap);
  }

  .card {
    display: flex;
    flex-direction: column;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    padding: 0;
    transition: border-color .15s ease, transform .15s ease, box-shadow .15s ease;
  }

  .card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: var(--shadow); }
  .card:active { transform: scale(.99); }

  .card-img {
    position: relative;
    aspect-ratio: 1;
    background: var(--surface2);
    display: grid;
    place-items: center;
    overflow: hidden;
  }

  .card-img img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-img .no-img { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; opacity: .45; }

  .status-dot {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 9px;
    height: 9px;
    border-radius: 50%;
    border: 2px solid var(--surface);
    background: var(--text3);
  }

  .dot-using { background: var(--accent); }
  .dot-broken { background: var(--red); }
  .dot-repair { background: var(--amber); }
  .dot-lost { background: var(--purple); }
  .dot-standby { background: var(--blue); }
  .dot-none, .dot-other { background: var(--text3); }

  .sheet-tag {
    position: absolute;
    top: 8px;
    left: 8px;
    max-width: 62%;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 600;
    color: var(--text2);
    background: var(--overlay);
    padding: 2px 6px;
    border-radius: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .card-body { padding: 9px 11px 11px; display: flex; flex-direction: column; gap: 2px; }

  .card-name {
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
  }

  .card-sub { font-size: 11px; color: var(--text2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  mark { background: color-mix(in srgb, var(--accent) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ── List view ────────────────────────────────────────────────────── */
  .grid.view-list { display: flex; flex-direction: column; gap: 6px; }

  .view-list .card { flex-direction: row; align-items: center; gap: 10px; padding: 8px; border-radius: var(--radius-sm); }
  .view-list .card:hover { transform: none; }
  .view-list .card-img { width: 46px; height: 46px; aspect-ratio: auto; border-radius: 8px; flex-shrink: 0; }
  .view-list .card-img .no-img { font-size: 18px; }
  .view-list .status-dot { width: 8px; height: 8px; top: 4px; right: 4px; }
  .view-list .sheet-tag { display: none; }
  .view-list .card-body { flex: 1; min-width: 0; padding: 0; }
  .view-list .card-name { -webkit-line-clamp: 1; }

  .row-barcode { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: var(--text3); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--surface2);
    color: var(--text2);
  }

  .badge-using { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
  .badge-broken { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
  .badge-repair { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
  .badge-lost { background: color-mix(in srgb, var(--purple) 14%, transparent); color: var(--purple); }
  .badge-standby { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }

  .view-list .row-badge { margin-left: auto; flex-shrink: 0; }

  .sheet-pill {
    display: inline-flex;
    align-items: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    background: var(--surface2);
    color: var(--text2);
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 2px 7px;
  }

  /* ── States ───────────────────────────────────────────────────────── */
  .state-box { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: clamp(36px, 9vw, 70px) var(--pad); text-align: center; }
  .state-icon { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 26px; }
  .state-title { font-size: 15px; font-weight: 500; }
  .state-sub { font-size: 13px; color: var(--text2); max-width: 34ch; line-height: 1.6; }

  .primary-btn {
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: var(--on-accent);
    border: none;
    border-radius: var(--radius-sm);
    padding: 10px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    min-height: 40px;
  }

  .primary-btn:hover { background: var(--accent2); }

  /* ── Skeletons ────────────────────────────────────────────────────── */
  .skeleton { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .skeleton-img { aspect-ratio: 1; background: var(--surface2); position: relative; overflow: hidden; }
  .skeleton-line { height: 10px; margin: 10px; border-radius: 4px; background: var(--surface2); position: relative; overflow: hidden; }
  .skeleton-line.short { width: 55%; }

  .skeleton-img::after, .skeleton-line::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text) 8%, transparent), transparent);
    transform: translateX(-100%);
    animation: shimmer 1.4s infinite;
  }

  @keyframes shimmer { to { transform: translateX(100%); } }

  /* ── Banner + note ────────────────────────────────────────────────── */
  .error-banner {
    display: none;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: color-mix(in srgb, var(--red) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--red) 34%, transparent);
    color: var(--red);
    font-size: 12.5px;
  }

  .error-banner.show { display: flex; }
  .error-banner span { flex: 1; min-width: 160px; }

  .retry-btn {
    background: var(--red);
    color: var(--on-accent);
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    min-height: 32px;
  }

  .stale-note { display: none; margin-bottom: 10px; font-size: 11.5px; color: var(--amber); }
  .stale-note.show { display: block; }

  .sentinel { height: 1px; }

  /* ── Dialogs ──────────────────────────────────────────────────────── */
  dialog {
    border: 1px solid var(--border2);
    background: var(--surface);
    color: var(--text);
    padding: 0;
    border-radius: 16px;
    box-shadow: var(--shadow);
  }

  .detail {
    width: min(100vw - 32px, 640px);
    max-height: 88dvh;
    overflow-y: auto;
    margin: auto;
  }

  .detail-img-wrap {
    position: relative;
    aspect-ratio: 16/9;
    min-height: 160px;          /* fallback for engines without aspect-ratio */
    background: var(--surface2);
    overflow: hidden;
  }
  .detail-img-wrap img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  .detail-img-btn {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    border: none;
    background: none;
    padding: 0;
    cursor: zoom-in;
  }
  .detail-img-placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 46px;
    opacity: .3;
    pointer-events: none;
  }


  .detail-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .detail-head { display: flex; align-items: flex-start; gap: 12px; }
  .detail-name { font-size: 17px; font-weight: 600; line-height: 1.35; flex: 1; word-break: break-word; }
  .detail-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .detail-brand { font-size: 12.5px; color: var(--text2); }

  .detail-fields { display: flex; flex-direction: column; border-top: 1px solid var(--border); }

  .field-row { display: flex; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); align-items: flex-start; }
  .field-label { flex: 0 0 clamp(96px, 30vw, 140px); font-size: 12px; color: var(--text2); }
  .field-value { flex: 1; font-size: 12.5px; font-weight: 500; word-break: break-word; text-align: right; display: flex; align-items: center; justify-content: flex-end; gap: 6px; flex-wrap: wrap; }
  .field-value.mono { font-family: 'IBM Plex Mono', monospace; color: var(--accent); }

  .copy-btn {
    border: 1px solid var(--border2);
    background: var(--surface2);
    color: var(--text2);
    border-radius: 5px;
    font-size: 10.5px;
    padding: 4px 8px;
    cursor: pointer;
    min-height: 28px;
  }

  .copy-btn:hover { color: var(--text); border-color: var(--text2); }

  .image-dialog { padding: 0; background: transparent; border: none; max-width: 96vw; max-height: 96dvh; }
  .image-dialog img { max-width: 96vw; max-height: 92dvh; object-fit: contain; display: block; border-radius: 8px; }

  .backdrop { position: fixed; inset: 0; background: var(--overlay); z-index: 80; display: none; }
  .backdrop.show { display: block; }

  dialog[open] { z-index: 90; position: fixed; inset: 0; margin: auto; }

  dialog.image-dialog[open] { inset: 0; margin: auto; }

  /* ── Toast ────────────────────────────────────────────────────────── */
  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%) translateY(8px);
    background: var(--text);
    color: var(--bg);
    font-size: 12px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    z-index: 120;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    .skeleton-img::after, .skeleton-line::after { animation: none; }
    .card:hover, .dash-tile:hover { transform: none; }
  }

  @media (min-width: 600px) { :root { --card-min: 165px; } }
  @media (min-width: 900px) { :root { --card-min: 185px; } }
  @media (min-width: 1200px) { :root { --card-min: 205px; } }
</style>
</head>
<body>

<header class="topbar">
  <div class="header-top">
    <button class="logo" id="home-btn" type="button">
      <span class="logo-icon" aria-hidden="true">📦</span>
      <span class="logo-text-wrap">
        <span class="logo-text" id="logo-text">DIS INVENTORY</span>
        <span class="logo-sub" id="logo-sub">LIVE · GOOGLE SHEETS</span>
      </span>
    </button>
    <div class="header-right">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button class="lang-btn active" data-lang="en" type="button">EN</button>
        <button class="lang-btn" data-lang="th" type="button">TH</button>
      </div>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" id="view-toggle" type="button" aria-label="Change view">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
      </button>
      <button class="icon-btn" id="refresh-btn" type="button" aria-label="Refresh data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </span>
    <input type="text" class="search-input" id="search-input" placeholder="Search…"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
      aria-label="Search items">
    <button class="search-clear" id="search-clear" type="button" aria-label="Clear search">✕</button>
  </div>

  <div class="tabs-wrap">
    <div class="tabs" id="tabs-bar" role="tablist"></div>
  </div>
  <div class="filters-wrap" id="filters-wrap" role="group"></div>
</header>

<main class="main" id="main">
  <div class="error-banner" id="error-banner" role="alert">
    <span id="error-text"></span>
    <button class="retry-btn" id="retry-btn" type="button">Retry</button>
  </div>
  <p class="stale-note" id="stale-note"></p>

  <section class="dashboard" id="home-dashboard" hidden>
    <h2 id="dashboard-title">Browse everything</h2>
    <div class="dash-group">
      <h3 id="dashboard-status">By status</h3>
      <div class="dash-tiles" id="dash-status"></div>
    </div>
    <div class="dash-group">
      <h3 id="dashboard-sheets">By department</h3>
      <div class="dash-tiles" id="dash-sheets"></div>
    </div>
    <p class="updated-row" id="updated-at"></p>
  </section>

  <div class="result-bar">
    <span class="result-count" id="result-count"></span>
    <label class="sort-wrap" for="sort-select">
      <span id="sort-label">Sort</span>
      <select id="sort-select"></select>
    </label>
  </div>

  <div class="grid" id="card-grid"></div>
  <div class="sentinel" id="sentinel" aria-hidden="true"></div>

  <div class="state-box" id="empty-state" hidden>
    <div class="state-icon" aria-hidden="true">📭</div>
    <div class="state-title" id="empty-title">No items found</div>
    <div class="state-sub" id="empty-sub">Try a different search term or barcode</div>
  </div>
</main>

<dialog class="detail" id="detail-dialog" aria-labelledby="detail-name">
  <div class="detail-img-wrap">
    <button class="detail-img-btn" id="detail-img-btn" type="button" hidden aria-label="View full size">
      <img id="detail-img" alt="" decoding="async">
    </button>
    <div class="detail-img-placeholder" id="detail-img-placeholder" aria-hidden="true">📦</div>
  </div>
  <div class="detail-body">
    <div class="detail-head">
      <h2 class="detail-name" id="detail-name"></h2>
      <button class="icon-btn" id="detail-close" type="button" aria-label="Close">✕</button>
    </div>
    <div class="detail-meta">
      <span class="detail-brand" id="detail-brand"></span>
      <span class="badge" id="detail-status"></span>
    </div>
    <div class="detail-fields" id="detail-fields"></div>
  </div>
</dialog>

<div class="backdrop" id="dialog-backdrop" hidden></div>

<dialog class="image-dialog" id="image-dialog" aria-label="Full size image">
  <img id="image-dialog-img" alt="">
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
